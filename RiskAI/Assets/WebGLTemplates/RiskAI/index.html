<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151611">
  <title>RiskAI · Dominios</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10130f;color:#efedde;font:16px system-ui,sans-serif}
    #game{position:fixed;display:block;width:100%;height:100%;outline:none;touch-action:none}
    #cover{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#10130f;z-index:2}
    #cover[hidden]{display:none}.card{width:min(460px,100%);border:2px ridge #a07c42;padding:32px;background:#23241b;box-shadow:inset 0 0 0 5px #151611,0 12px 50px #0009}
    h1{letter-spacing:.1em;font-size:32px;margin:0 0 12px;color:#ddb66f}p{line-height:1.5;color:#c7d0cf}
    progress{width:100%;height:12px;accent-color:#ddb66f}button{min-height:44px;padding:8px 20px;background:#284451;color:#fff;border:1px solid #a07c42;border-radius:6px;font:inherit;cursor:pointer}
    #safe{position:fixed;inset:0;pointer-events:none;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="RiskAI. Conquista ciudades y controla territorios."></canvas>
  <div id="safe"></div>
  <div id="cover"><div class="card"><h1>DOMINIOS</h1><p id="status">Preparando RiskAI…</p><progress id="progress" value="0" max="1" aria-label="Descarga del juego"></progress><p id="hint">Ratón, dedos o lápiz. Elige mapa y jugadores al terminar la carga.</p><button id="retry" hidden>Volver a intentar</button></div></div>
  <script src="riskai-pen.js"></script>
  <script>
    const canvas=document.getElementById('game'),cover=document.getElementById('cover'),status=document.getElementById('status'),progress=document.getElementById('progress');
    // Installed before the Unity loader so pen compatibility mouse events cannot
    // reach Unity before the shared Pen device receives their original input.
    window.riskaiPen=window.RiskAIPen?window.RiskAIPen.attach(canvas):null;
    let instance=null;
    window.riskaiSafeInsets=[0,0,0,0];
    function refreshViewport(){
      const viewport=window.visualViewport;
      const width=viewport?viewport.width:window.innerWidth,height=viewport?viewport.height:window.innerHeight;
      for(const element of [canvas,cover]){
        element.style.left=(viewport?viewport.offsetLeft:0)+'px';element.style.top=(viewport?viewport.offsetTop:0)+'px';
        element.style.width=width+'px';element.style.height=height+'px';element.style.right='auto';element.style.bottom='auto';
      }
      const s=getComputedStyle(document.getElementById('safe'));
      window.riskaiSafeInsets=[s.paddingLeft,s.paddingTop,s.paddingRight,s.paddingBottom].map(x=>parseFloat(x)||0);
    }
    window.addEventListener('resize',refreshViewport);window.addEventListener('orientationchange',refreshViewport);
    if(window.visualViewport){window.visualViewport.addEventListener('resize',refreshViewport);window.visualViewport.addEventListener('scroll',refreshViewport);}
    refreshViewport();
    canvas.addEventListener('contextmenu',event=>event.preventDefault());
    canvas.addEventListener('wheel',event=>event.preventDefault(),{passive:false});
    canvas.addEventListener('pointerdown',()=>canvas.focus({preventScroll:true}));
    document.getElementById('retry').onclick=()=>location.reload();
    function fail(message){cover.hidden=false;status.textContent='No se pudo iniciar la partida.';document.getElementById('hint').textContent=String(message);progress.hidden=true;document.getElementById('retry').hidden=false;}
    const config={
      dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl:'StreamingAssets',companyName:'RiskAI',productName:'RiskAI · Dominios',productVersion:'{{{ PRODUCT_VERSION }}}',
      devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),
      showBanner:(message,type)=>{if(type==='error')console.error(message);else console.warn(message);}
    };
    const loader=document.createElement('script');loader.src='Build/{{{ LOADER_FILENAME }}}';
    loader.onerror=()=>fail('La descarga del juego no respondió. Revisa la conexión y vuelve a intentar.');
    loader.onload=()=>createUnityInstance(canvas,config,value=>{progress.value=value;status.textContent=value<1?'Cargando RiskAI · '+Math.round(value*100)+' %':'Preparando el menú…';})
      .then(game=>{instance=game;window.riskaiInstance=game;cover.hidden=true;canvas.focus({preventScroll:true});})
      .catch(fail);
    if(window.riskaiPen)document.body.appendChild(loader);
    else fail('No se pudieron cargar los controles. Vuelve a intentar la descarga.');
  </script>
</body>
</html>
